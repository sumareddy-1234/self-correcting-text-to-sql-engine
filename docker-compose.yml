services:
  db:
    image: postgres:15-alpine
    container_name: text2sql_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_messy
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/seed_db.sql:/docker-entrypoint-initdb.d/seed_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_messy"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: text2sql_api_service
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-ecommerce_messy}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
